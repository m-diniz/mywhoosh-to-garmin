name: Dependabot auto-merge

# Ativa o merge automático (squash) nos PRs do Dependabot dos grupos seguros.
# O merge só acontece depois que o check "Tests" passar (regra do branch master).
# O grupo python-sensitive (garminconnect, fit-tool) nunca é aprovado aqui.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'm-diniz/mywhoosh-to-garmin'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for safe groups
        if: steps.metadata.outputs.dependency-group == 'python-safe' || steps.metadata.outputs.dependency-group == 'github-actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave sensitive updates for manual review
        if: steps.metadata.outputs.dependency-group != 'python-safe' && steps.metadata.outputs.dependency-group != 'github-actions'
        run: echo "Group '${{ steps.metadata.outputs.dependency-group }}' needs manual review and a real-data test."
