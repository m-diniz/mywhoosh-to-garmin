version: 2

# Mensal e agrupado: no máximo um PR por grupo por mês.
#
# Grupos e merge automático (ver .github/workflows/dependabot-automerge.yml):
#   github-actions   -> automático (só afeta o CI)
#   python-safe      -> automático, se o CI passar
#   python-sensitive -> MANUAL: garminconnect (login/envio ao Garmin) e fit-tool
#                       (regrava o FIT) precisam de teste com dados reais.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "python"
    allow:
      - dependency-type: "all"
    groups:
      python-sensitive:
        patterns:
          - "garminconnect"
          - "fit-tool"
      python-safe:
        patterns: ["*"]
        exclude-patterns:
          - "garminconnect"
          - "fit-tool"
